<div class="page-header">
  <h2>Certifications</h2>
  <p class="subtitle">Quality and safety standards we meet</p>
</div>

<div class="cert-grid">
  <app-glass-card *ngFor="let cert of certifications">
    <div class="cert-icon">{{ cert.icon }}</div>
    <h4>{{ cert.name }}</h4>
    <p class="metric">{{ cert.description }}</p>
  </app-glass-card>
</div>
