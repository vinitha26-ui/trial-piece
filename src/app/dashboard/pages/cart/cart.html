<div class="page-header">
  <h2>Cart</h2>
  <p class="subtitle">{{ items.length }} item(s) in your cart</p>
</div>

<app-glass-card *ngFor="let item of items" class="cart-item">
  <div class="item-row">
    <div>
      <h4>{{ item.name }}</h4>
      <p class="metric">Qty: {{ item.qty }}</p>
    </div>
    <div class="price">₹{{ item.price * item.qty }}</div>
  </div>
</app-glass-card>

<app-glass-card class="total-card">
  <div class="item-row">
    <h4>Total</h4>
    <div class="price">₹{{ total }}</div>
  </div>
  <button class="cta">Checkout</button>
</app-glass-card>
