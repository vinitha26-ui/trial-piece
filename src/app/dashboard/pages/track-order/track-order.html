<div class="page-header">
  <h2>Track Order</h2>
  <p class="subtitle">Enter your order ID to see status</p>
</div>

<app-glass-card>
  <input type="text" placeholder="Enter Order ID (e.g. CVC-10234)" class="order-input" />
  <button class="cta">Track</button>

  <div class="timeline">
    <div class="step done"><span class="dot"></span> Order placed</div>
    <div class="step done"><span class="dot"></span> Processed & packed</div>
    <div class="step active"><span class="dot"></span> Shipped</div>
    <div class="step"><span class="dot"></span> Out for delivery</div>
    <div class="step"><span class="dot"></span> Delivered</div>
  </div>
</app-glass-card>
